<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道明中學 國二下 理化錯題本</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 供瀏覽器直接解析 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 列印專屬的 CSS 設定 -->
  <style>
    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm;
      }
      body {
        background-color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MistakeNotebook = () => {
      const [printMode, setPrintMode] = useState('solution'); // 'exam' or 'solution'

      // 觸發列印
      const handlePrint = (mode) => {
        setPrintMode(mode);
        // 使用 setTimeout 確保 React 狀態更新並渲染完 DOM 後再執行列印
        setTimeout(() => {
          window.print();
        }, 300);
      };

      const questions = [
        {
          id: 2,
          source: "超級翰將",
          page: 70,
          topic: "電解質的定義",
          question: "下列何者不是電解質？",
          options: [
            "(A) 稀硫酸",
            "(B) 濃硫酸",
            "(C) 銀",
            "(D) 肥皂水"
          ],
          correctAnswer: "C",
          explanation: {
            title: "【判斷電解質的關鍵要素】",
            coreConcept: "電解質必須是「化合物」，且在「溶於水」或「熔融狀態」下能夠解離出正負離子而導電的物質。",
            details: [
              { opt: "(A) 稀硫酸 (H₂SO₄)", desc: "強酸化合物，在水中會解離出氫離子 (H⁺) 與硫酸根離子 (SO₄²⁻)，可導電，為電解質。" },
              { opt: "(B) 濃硫酸 (H₂SO₄)", desc: "本質仍是化合物，加水後同樣能解離導電，屬於電解質。" },
              { opt: "(C) 銀 (Ag)", desc: "是金屬「元素」，不是化合物。雖然金屬可以導電，但它是利用「自由電子」導電，而非解離出離子，因此不屬於電解質。 (本題正確解答)" },
              { opt: "(D) 肥皂水", desc: "肥皂主要成分為脂肪酸鈉，溶於水會解離出鈉離子與脂肪酸根離子，水溶液呈鹼性且可導電，為電解質。" }
            ]
          }
        },
        {
          id: 7,
          source: "超級翰將",
          page: 70,
          topic: "常見物質的酸鹼性",
          question: "下列何者屬於電解質，且其水溶液為鹼性？",
          options: [
            "(A) NaHCO₃",
            "(B) CH₃COOH",
            "(C) NaCl",
            "(D) C₂H₅OH"
          ],
          correctAnswer: "A",
          explanation: {
            title: "【常見物質的酸鹼性與電解質判斷】",
            coreConcept: "解題關鍵在於必須同時符合「是電解質」與「水溶液呈鹼性」兩個條件。",
            details: [
              { opt: "(A) NaHCO₃ (碳酸氫鈉/小蘇打)", desc: "溶於水會解離出 Na⁺ 與 HCO₃⁻，為電解質。其水溶液會發生微弱水解，呈現弱鹼性。完全符合題意！ (本題正確解答)" },
              { opt: "(B) CH₃COOH (醋酸)", desc: "為弱酸，在水中會部分解離出 H⁺，為電解質，但其水溶液呈酸性。不符題意。" },
              { opt: "(C) NaCl (食鹽/氯化鈉)", desc: "溶於水完全解離出 Na⁺ 與 Cl⁻，是強電解質，但其水溶液呈中性。不符題意。" },
              { opt: "(D) C₂H₅OH (乙醇/酒精)", desc: "溶於水不會解離出離子，為非電解質，且其水溶液呈中性。完全不符題意。" }
            ]
          }
        },
        {
          id: 1,
          source: "超級翰將",
          page: 73,
          topic: "解離反應式",
          question: "寫出下列物質的解離反應式：\n(1) 氫氧化鈣：__________________。\n(2) 硫酸鉀：__________________。",
          options: [],
          correctAnswer: "見解析",
          explanation: {
            title: "【解離反應式的寫法】",
            coreConcept: "解離方程式必須符合「原子不滅」與「電荷守恆」（正負電荷總和為零）。",
            details: [
              { opt: "(1) 氫氧化鈣", desc: "化學式為 Ca(OH)₂，解離時產生 1 個鈣離子 (Ca²⁺) 與 2 個氫氧根離子 (OH⁻)。\n反應式：Ca(OH)₂ → Ca²⁺ + 2OH⁻" },
              { opt: "(2) 硫酸鉀", desc: "化學式為 K₂SO₄，解離時產生 2 個鉀離子 (K⁺) 與 1 個硫酸根離子 (SO₄²⁻)。\n反應式：K₂SO₄ → 2K⁺ + SO₄²⁻" }
            ]
          }
        },
        {
          id: 2,
          source: "超級翰將",
          page: 73,
          topic: "水溶液的電中性",
          question: "氯化鈣水溶液中，鈣離子和氯離子所帶的總電量比是多少？",
          options: [
            "(A) 1：2",
            "(B) 2：1",
            "(C) 1：1",
            "(D) 4：1"
          ],
          correctAnswer: "C",
          explanation: {
            title: "【電中性原理】",
            coreConcept: "任何電解質水溶液必定維持「電中性」，也就是「陽離子所帶總正電量 = 陰離子所帶總負電量」。",
            details: [
              { opt: "解題關鍵", desc: "不論離子個數比例為何，正負電荷的總電量一定相等，因此總電量比永遠是 1：1。" },
              { opt: "延伸觀念", desc: "氯化鈣 (CaCl₂) 解離式為 CaCl₂ → Ca²⁺ + 2Cl⁻。粒子數比 (Ca²⁺ : Cl⁻) = 1 : 2。但單一離子電荷比 (+2 : -1) 的絕對值為 2 : 1。總電量比 = (1 × 2) : (2 × 1) = 2 : 2 = 1 : 1。" }
            ]
          }
        },
        {
          id: 3,
          source: "超級翰將",
          page: 73,
          topic: "莫耳數與解離",
          question: "取 2 莫耳的硫酸溶於水，假設硫酸可以完全解離，則水溶液中含有多少莫耳的離子？",
          options: [
            "(A) 8",
            "(B) 6",
            "(C) 4",
            "(D) 2"
          ],
          correctAnswer: "B",
          explanation: {
            title: "【解離的粒子數目計算】",
            coreConcept: "先寫出正確的解離反應式，利用係數比 = 莫耳數比，求出各離子的莫耳數後相加。",
            details: [
              { opt: "步驟1：寫出反應式", desc: "硫酸解離：H₂SO₄ → 2H⁺ + SO₄²⁻" },
              { opt: "步驟2：判斷比例", desc: "1 莫耳的 H₂SO₄ 會解離出 2 莫耳的 H⁺ 和 1 莫耳的 SO₄²⁻，共產生 3 莫耳的離子。" },
              { opt: "步驟3：計算總量", desc: "當有 2 莫耳的 H₂SO₄ 解離時，會產生 2 × 3 = 6 莫耳的離子。 (本題正確解答)" }
            ]
          }
        },
        {
          id: 5,
          source: "超級翰將",
          page: 73,
          topic: "解離模型與離子移動",
          question: "右圖為燒杯內氯化鎂（MgCl₂）解離出鎂離子與氯離子的示意圖，其中甲和乙均為帶電的粒子。則下列有關此杯水溶液的敘述何者正確？",
          imageUrl: "Nature-Louis-2-images/hj-p73-5.jpg",
          options: [
            "(A) 甲為 Cl⁻",
            "(B) 甲粒子和乙粒子均勻分散於水溶液中且靜止不動",
            "(C) 水溶液中乙粒子個數比甲粒子多，所以水溶液有帶電而不呈電中性",
            "(D) 水溶液通電時，甲粒子會往負極移動，乙粒子會往正極移動"
          ],
          correctAnswer: "D",
          explanation: {
            title: "【解離微觀模型與通電行為】",
            coreConcept: "從化學式判斷解離出的正負離子數量比例，藉此對應圖中的粒子；通電時，陽離子（帶正電）向負極移動，陰離子（帶負電）向正極移動。",
            details: [
              { opt: "判斷甲、乙粒子", desc: "氯化鎂 (MgCl₂) 解離式：MgCl₂ → Mg²⁺ + 2Cl⁻。由此可知 氯離子(Cl⁻) 的數量是 鎂離子(Mg²⁺) 的 2 倍。觀察附圖，乙粒子數量多於甲粒子，因此 乙為 Cl⁻，甲為 Mg²⁺。(A)選項錯誤。" },
              { opt: "(B) 粒子狀態", desc: "水溶液中的離子是可以自由移動的，並非靜止不動。錯誤。" },
              { opt: "(C) 電中性", desc: "雖然 Cl⁻ 數量較多，但單一 Mg²⁺ 帶 2 單位正電，單一 Cl⁻ 帶 1 單位負電，總正負電量仍相等，維持電中性。錯誤。" },
              { opt: "(D) 通電時的移動", desc: "甲 (Mg²⁺) 帶正電，會被吸引往負極移動；乙 (Cl⁻) 帶負電，會被吸引往正極移動。完全正確！" }
            ]
          }
        }
      ];

      // 將錯題依據「出處 -> 頁碼 -> 題號」進行排序與分組
      const sortedQuestions = [...questions].sort((a, b) => {
        if (a.source !== b.source) return a.source.localeCompare(b.source);
        if (a.page !== b.page) return a.page - b.page;
        return a.id - b.id;
      });

      const groupedQuestions = sortedQuestions.reduce((acc, q) => {
        const groupName = `${q.source} P${q.page}`;
        if (!acc[groupName]) acc[groupName] = [];
        acc[groupName].push(q);
        return acc;
      }, {});

      return (
        <div className="min-h-screen font-sans print:bg-white print:py-0 py-8">
          
          {/* 操作區塊 (列印時隱藏) */}
          <div className="max-w-5xl mx-auto mb-6 px-4 print:hidden">
            <div className="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-gray-800">📖 道明中學 國二下 理化科 第二次段考範圍</h1>
                <h2 className="text-lg font-semibold text-gray-700 mt-1">第3章 電解質與酸鹼鹽 &nbsp; 第4章 反應速率與平衡</h2>
                <p className="text-gray-500 text-sm mt-2">請選擇您要列印的模式。列印格式已預設優化為 A4 直式。</p>
              </div>
              <div className="flex gap-3">
                <button 
                  onClick={() => handlePrint('exam')}
                  className="px-5 py-2.5 bg-indigo-50 text-indigo-600 font-semibold rounded-md border border-indigo-200 hover:bg-indigo-100 transition-colors flex items-center gap-2 cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  列印考卷 (隱藏解析)
                </button>
                <button 
                  onClick={() => handlePrint('solution')}
                  className="px-5 py-2.5 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2 cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                  列印解析卷
                </button>
              </div>
            </div>
          </div>

          {/* A4 列印頁面主體 */}
          <div className="max-w-[210mm] mx-auto bg-white shadow-xl print:shadow-none min-h-[297mm] p-[20mm] print:p-0 print:m-0">
            
            {/* 試卷表頭 */}
            <div className="text-center mb-8 border-b-2 border-gray-800 pb-4">
              <h2 className="text-2xl font-extrabold tracking-wide text-gray-900">道明中學 國二下 理化科 第二次段考範圍</h2>
              <h3 className="text-xl font-bold text-gray-800 mt-2">第3章 電解質與酸鹼鹽 &nbsp; 第4章 反應速率與平衡</h3>
              <div className="flex justify-between mt-6 text-lg font-medium text-gray-700">
                <span>錯題筆記</span>
                <span>姓名：<span className="font-bold text-xl tracking-widest border-b-2 border-gray-800 px-8 pb-1">蔡睿澄</span></span>
              </div>
            </div>

            {/* 題目列表 (已依據出處分組) */}
            <div className="flex flex-col gap-10">
              {Object.entries(groupedQuestions).map(([groupName, groupQs]) => (
                <div key={groupName} className="flex flex-col gap-8">
                  {/* 出處標題標籤 */}
                  <div className="flex items-center border-b-2 border-gray-400 pb-2 print:border-gray-800">
                    <span className="bg-[#FF8800] text-white px-4 py-1.5 text-md font-bold rounded-t-lg tracking-widest print:bg-white print:text-[#FF8800] print:border-2 print:border-[#FF8800] print:rounded-md print:px-3">
                      📂 出處：{groupName}
                    </span>
                  </div>

                  {groupQs.map((q) => (
                    <div key={`${q.source}-${q.page}-${q.id}`} className="flex flex-row border-b border-gray-300 pb-8 print:break-inside-avoid">
                      
                      {/* 左側：題目區 */}
                      <div className="w-1/2 pr-6 border-r-2 border-dashed border-gray-300">
                        <div className="flex gap-2">
                          <span className="font-bold text-xl">{q.id}.</span>
                          <div className="text-lg font-medium leading-relaxed text-gray-800 whitespace-pre-wrap">
                            {q.question}
                          </div>
                        </div>
                        
                        {/* 支援圖片顯示 */}
                        {q.imageUrl && (
                          <div className="mt-4 mb-2 pl-6">
                            <img src={q.imageUrl} alt="題目附圖" className="max-w-full w-[85%] h-auto rounded border border-gray-200 shadow-sm print:shadow-none print:border-gray-400" />
                          </div>
                        )}

                        <div className="mt-4 pl-6 flex flex-col gap-2 text-lg">
                          {q.options.map((opt, idx) => (
                            <div key={idx} className="text-gray-700">{opt}</div>
                          ))}
                        </div>
                      </div>

                      {/* 右側：解析區 */}
                      <div className="w-1/2 pl-6 relative">
                        <div className={`h-full ${printMode === 'exam' ? 'print:invisible' : ''}`}>
                          <div className="flex items-center gap-2 mb-3 text-blue-800">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                            <span className="font-bold text-lg">深度解析</span>
                            <span className="ml-auto bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                              解答：{q.correctAnswer}
                            </span>
                          </div>
                          
                          <div className="bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                            <h4 className="font-bold text-[#FF0000] mb-2">{q.explanation.title}</h4>
                            <p className="text-gray-700 mb-4 leading-relaxed text-sm bg-yellow-100/50 p-2 rounded whitespace-pre-wrap">
                              <span className="font-semibold text-amber-700">💡 核心觀念：</span>
                              {q.explanation.coreConcept}
                            </p>
                            
                            <ul className="space-y-3">
                              {q.explanation.details.map((detail, idx) => (
                                <li key={idx} className="text-sm leading-relaxed whitespace-pre-wrap">
                                  <span className={`font-semibold mr-1 ${q.correctAnswer !== "見解析" && detail.opt.includes(q.correctAnswer + ")") ? 'text-green-700' : 'text-gray-800'}`}>
                                    {detail.opt}
                                  </span>
                                  <span className="text-gray-600">
                                    {detail.desc}
                                  </span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                        
                        {/* 考卷模式的提示字 */}
                        <div className={`absolute inset-0 flex items-center justify-center opacity-0 ${printMode === 'exam' ? 'print:opacity-100' : ''} hidden print:flex pointer-events-none`}>
                           <span className="text-gray-300 font-bold tracking-widest text-2xl rotate-12 border-4 border-gray-200 p-4 rounded-xl">
                             訂正空間 / 作答區
                           </span>
                        </div>
                      </div>

                    </div>
                  ))}
                </div>
              ))}
            </div>

            {/* 頁尾 */}
            <div className="mt-8 text-center text-gray-400 text-sm print:block">
              - 努力學習，必有收穫 -
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MistakeNotebook />);
  </script>
</body>
</html>
