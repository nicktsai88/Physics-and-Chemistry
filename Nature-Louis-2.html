            coreConcept: "凡是含有碳酸根的物質（如大理石、貝殼、蛋殼），遇到酸類物質皆會發生化學反應，釋放出二氧化碳氣體。",
            details: [
              { opt: "反應物判斷", desc: "雞蛋殼與貝殼的主要化學成分皆為「碳酸鈣 (CaCO₃)」。食醋則含有醋酸 (CH₃COOH)。" },
              { opt: "生成物判斷", desc: "碳酸鈣遇酸會被分解，產生「二氧化碳 (CO₂)」氣體。這些氣泡附著在蛋殼表面使其浮力增加而上浮，氣泡破裂脫落後蛋又下沉，造成翻滾現象。故選(A)。" }
            ]
          }
        },
        {
          id: 39,
          source: "鍾揚理化",
          page: 42,
          topic: "金屬活性與強酸的反應差異",
          question: "有一合金中含有鎂、鋅、鐵、銅四種金屬，欲由合金中取出銅，小揚到實驗室內找到濃硫酸、濃硝酸、濃鹽酸、濃氨水，則有幾種酸可完成目的？(可稍微加熱)",
          options: [
            "(A) 0種",
            "(B) 1種",
            "(C) 2種",
            "(D) 3種"
          ],
          correctAnswer: "B",
          explanation: {
            title: "【利用酸鹼反應分離活性不同的金屬】",
            coreConcept: "目標是尋找一種溶劑，能夠「把鎂、鋅、鐵溶解」，但「不能溶解銅」，如此一來過濾後就能在濾紙上得到純銅固體。",
            details: [
              { opt: "金屬活性分析", desc: "金屬活性：鎂 > 鋅 > 鐵 > (氫) > 銅。銅的活性極小，一般不會與稀酸或非氧化性酸反應。" },
              { opt: "酸的選擇：濃鹽酸", desc: "鹽酸能與活性大於氫的(Mg, Zn, Fe)反應產生氫氣而將其溶解，但「不會」與銅反應。能完美達成目標分離出銅！" },
              { opt: "酸的選擇：濃硝酸、熱濃硫酸", desc: "這兩者皆具有強烈的「氧化力」，除了能溶解活性大的金屬外，就連活性極小的「銅」也會被它們氧化溶解。如此一來所有金屬都溶掉了，無法分離出銅。" },
              { opt: "結論", desc: "濃氨水是鹼性(不計入)。四種試劑中，只有「濃鹽酸」這 1 種酸能完成分離銅的目的。選(B)。" }
            ]
          }
        },
        {
          id: 40,
          source: "鍾揚理化",
          page: 42,
          topic: "阿瑞尼士酸鹼學說",
          question: "下列哪一種離子代表酸性？",
          options: [
            "(A) CH₃COO⁻",
            "(B) SO₄²⁻",
            "(C) NO₃⁻",
            "(D) H⁺"
          ],
          correctAnswer: "D",
          explanation: {
            title: "【酸鹼學說的核心定義】",
            coreConcept: "根據阿瑞尼士學說，物質在水中解離出「氫離子」的稱為酸，解離出「氫氧根離子」的稱為鹼。",
            details: [
              { opt: "(D) H⁺", desc: "正確。H⁺ (氫離子) 是所有酸類水溶液的共通特徵，代表了溶液的酸性本質。" },
              { opt: "(A)(B)(C)", desc: "這三者分別為醋酸根、硫酸根、硝酸根離子。它們都是酸解離後殘留下來的陰離子（酸根），本身並不能代表水溶液呈酸性。" }
            ]
          }
        },
        {
          id: 41,
          source: "鍾揚理化",
          page: 42,
          topic: "酚酞指示劑的變色範圍",
          question: "在純水中加入哪一種物質後，可使酚酞指示劑呈無色反應？",
          options: [
            "(A) 醋酸",
            "(B) 氨",
            "(C) 氫氧化鈉",
            "(D) 肥皂粉"
          ],
          correctAnswer: "A",
          explanation: {
            title: "【酚酞指示劑的特性】",
            coreConcept: "酚酞指示劑的變色十分單純：在「鹼性」溶液中呈現「紅色」，而在「中性」或「酸性」溶液中皆維持「無色」。",
            details: [
              { opt: "題目條件分析", desc: "純水為中性(無色)。題目要求加入物質後依然呈「無色」，故須尋找水溶液呈酸性或中性的物質。" },
              { opt: "(B)(C)(D)", desc: "氨水、氫氧化鈉、肥皂水，這三者皆為鹼性物質，加入後會使酚酞變為紅色。" },
              { opt: "(A) 醋酸", desc: "正確。醋酸呈酸性，加入後酚酞依然維持無色。" }
            ]
          }
        },
        {
          id: 43,
          source: "鍾揚理化",
          page: 42,
          topic: "氨水的酸鹼性與指示劑變色",
          question: "氨水在下列指示劑中所呈現的顏色，何者錯誤？",
          options: [
            "(A) 石蕊試紙呈藍色",
            "(B) 廣用試紙呈藍色",
            "(C) 酚酞試液呈無色",
            "(D) 酚酞試液呈紅色"
          ],
          correctAnswer: "C",
          explanation: {
            title: "【鹼性溶液的常規指示劑變色】",
            coreConcept: "氨水(NH₄OH)呈弱鹼性，必須熟記三大常見指示劑遇鹼性的變色結果。",
            details: [
              { opt: "(A)", desc: "正確。石蕊試紙遇鹼性溶液會從紅色變為「藍色」。" },
              { opt: "(B)", desc: "正確。廣用試紙遇鹼性溶液會呈現藍色或紫色系。" },
              { opt: "(C)(D) 酚酞變色", desc: "酚酞指示劑遇鹼性溶液應呈現「紅色」(D對)。因此，(C)選項描述呈無色是完全錯誤的，為本題要選的答案。" }
            ]
          }
        },
        {
          id: 44,
          source: "鍾揚理化",
          page: 42,
          topic: "鹼性水溶液的共通離子",
          question: "阿摩尼亞、肥皂水、石灰水中所含的共同離子為何？",
          options: [
            "(A) NH₄⁺",
            "(B) Ca²⁺",
            "(C) OH⁻",
            "(D) H⁺"
          ],
          correctAnswer: "C",
          explanation: {
            title: "【鹼性物質的本質】",
            coreConcept: "不論是什麼樣的鹼性化合物，只要溶於水呈鹼性，水溶液中必然解離出相同的陰離子。",
            details: [
              { opt: "物質酸鹼性分析", desc: "阿摩尼亞(氨水)、肥皂水、石灰水(氫氧化鈣水溶液)，這三種生活中常見的水溶液，共通特點就是它們皆為「鹼性」。" },
              { opt: "阿瑞尼士學說", desc: "根據酸鹼學說，所有鹼性水溶液中，必定都含有共同的「氫氧根離子 (OH⁻)」。故選(C)。" }
            ]
          }
        },
        {
          id: 47,
          source: "鍾揚理化",
          page: 42,
          topic: "金屬活性對氫的反應",
          question: "(甲)鐵；(乙)鎂；(丙)鋅；(丁)銅；(戊)金；(己)鋁，以上六種金屬與鹽酸作用會產生氫氣的共有幾項？",
          options: [
            "(A) 2",
            "(B) 3",
            "(C) 4",
            "(D) 5"
          ],
          correctAnswer: "C",
          explanation: {
            title: "【金屬活性表的應用】",
            coreConcept: "金屬與稀酸（如鹽酸、稀硫酸）反應產生氫氣的絕對條件是：該金屬的活性必須「大於氫」。",
            details: [
              { opt: "金屬活性順序", desc: "鉀 > 鈉 > 鈣 > 鎂 > 鋁 > 碳 > 鋅 > 鐵 > 錫 > 鉛 >【氫】> 銅 > 汞 > 銀 > 鉑 > 金。" },
              { opt: "活性大於氫 (會反應)", desc: "活性排在氫前面的有：(甲)鐵、(乙)鎂、(丙)鋅、(己)鋁。這 4 種金屬皆會與鹽酸反應產生氫氣。" },
              { opt: "活性小於氫 (不反應)", desc: "活性排在氫後面的有：(丁)銅、(戊)金。不會反應。故總共有 4 項會反應，選(C)。" }
            ]
          }
        }
      ];

      // 將錯題依據「出處 -> 頁碼 -> 題號」進行排序與分組
      const sortedQuestions = [...questions].sort((a, b) => {
        if (a.source !== b.source) return a.source.localeCompare(b.source);
        if (a.page !== b.page) return a.page - b.page;
        return a.id - b.id;
      });

      const groupedQuestions = sortedQuestions.reduce((acc, q) => {
        const groupName = `${q.source} P${q.page}`;
        if (!acc[groupName]) acc[groupName] = [];
        acc[groupName].push(q);
        return acc;
      }, {});

      return (
        <div className="min-h-screen font-sans print:bg-white print:py-0 py-4 sm:py-8">
          
          {/* 操作區塊 (列印時隱藏) */}
          <div className="w-full max-w-[98%] xl:max-w-[95%] mx-auto mb-4 sm:mb-6 px-2 sm:px-4 print:hidden">
            <div className="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-gray-800">📖 道明中學 國二下 理化科 第二次段考範圍</h1>
                <h2 className="text-lg font-semibold text-gray-700 mt-1">第3章 電解質與酸鹼鹽 &nbsp; 第4章 反應速率與平衡</h2>
                <p className="text-gray-500 text-sm mt-2">請選擇您要列印的模式。列印格式已預設優化為 A4 直式。</p>
              </div>
              <div className="flex gap-3">
                <button 
                  onClick={() => handlePrint('exam')}
                  className="px-5 py-2.5 bg-indigo-50 text-indigo-600 font-semibold rounded-md border border-indigo-200 hover:bg-indigo-100 transition-colors flex items-center gap-2 cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  列印考卷 (隱藏解析)
                </button>
                <button 
                  onClick={() => handlePrint('solution')}
                  className="px-5 py-2.5 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2 cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                  列印解析卷
                </button>
              </div>
            </div>
          </div>

          {/* A4 列印頁面主體 (在螢幕上滿版展開，列印時維持 210mm) */}
          <div className="w-full max-w-[98%] xl:max-w-[95%] mx-auto bg-white shadow-xl print:w-[210mm] print:max-w-[210mm] print:shadow-none min-h-[297mm] p-6 sm:p-10 print:p-0 print:m-0">
            
            {/* 試卷表頭 */}
            <div className="text-center mb-8 border-b-2 border-gray-800 pb-4">
              <h2 className="text-2xl font-extrabold tracking-wide text-gray-900">道明中學 國二下 理化科 第二次段考範圍</h2>
              <h3 className="text-xl font-bold text-gray-800 mt-2">第3章 電解質與酸鹼鹽 &nbsp; 第4章 反應速率與平衡</h3>
              <div className="flex justify-between mt-6 text-lg font-medium text-gray-700">
                <span>錯題筆記</span>
                <span>姓名：<span className="font-bold text-xl tracking-widest border-b-2 border-gray-800 px-8 pb-1">蔡睿澄</span></span>
              </div>
            </div>

            {/* 題目列表 (已依據出處分組) */}
            <div className={`flex flex-col ${printMode === 'exam' ? 'gap-6 print:gap-4' : 'gap-10 print:gap-10'}`}>
              {Object.entries(groupedQuestions).map(([groupName, groupQs], groupIndex) => (
                <div key={groupName} className={`flex flex-col ${printMode === 'exam' ? 'gap-4 print:gap-2' : 'gap-8 print:gap-8'} ${groupIndex > 0 && printMode !== 'exam' ? 'print:break-before-page' : ''}`}>
                  
                  {groupQs.map((q, index) => {
                    const isFirst = index === 0;
                    
                    // 單一題目的內容區塊
                    const questionContent = (
                      <div key={`${q.source}-${q.page}-${q.id}`} className={`flex flex-row border-b border-gray-300 ${printMode === 'exam' ? 'pb-4 print:pb-3' : 'pb-8 print:pb-8'} ${!isFirst ? 'print:break-inside-avoid' : ''}`}>
                        
                        {/* 左側：題目區 */}
                        <div className="w-1/2 pr-6 border-r-2 border-dashed border-gray-300">
                          <div className="flex gap-2">
                            <span className="font-bold text-xl">{q.id}.</span>
                            <div className="text-lg font-medium leading-relaxed text-gray-800 whitespace-pre-wrap">
                              {q.question}
                            </div>
                          </div>
                          
                          {/* 支援圖片顯示 (第一張) */}
                          {q.imageUrl && (
                            <div className={`${printMode === 'exam' ? 'mt-2 mb-1 print:mt-1' : 'mt-4 mb-2'} pl-6`}>
                              <img src={q.imageUrl} alt="題目附圖" className="max-w-full w-[70%] h-auto rounded border border-gray-200 shadow-sm print:w-[70%] print:shadow-none print:border-gray-400" />
                            </div>
                          )}

                          {/* 支援雙圖片顯示 (第二張) */}
                          {q.imageUrl2 && (
                            <div className={`${printMode === 'exam' ? 'mt-1 mb-1 print:mt-1' : 'mt-2 mb-2'} pl-6`}>
                              <img src={q.imageUrl2} alt="題目附圖2" className="max-w-full w-[70%] h-auto rounded border border-gray-200 shadow-sm print:w-[70%] print:shadow-none print:border-gray-400" />
                            </div>
                          )}

                          <div className={`${printMode === 'exam' ? 'mt-2 print:mt-1' : 'mt-4'} pl-6 grid ${q.options.length > 4 ? 'grid-cols-2 sm:grid-cols-3 print:grid-cols-3' : 'grid-cols-1'} ${printMode === 'exam' ? 'gap-1 gap-x-4 print:gap-0' : 'gap-2 gap-x-4'} text-lg`}>
                            {q.options.map((opt, idx) => (
                              <div key={idx} className="text-gray-700">{opt}</div>
                            ))}
                          </div>
                        </div>

                        {/* 右側：解析區 */}
                        <div className="w-1/2 pl-6 relative">
                          {/* 考卷模式下將原 h-full 加上 print:hidden，徹底釋放高度，讓左側題目決定此題行高 */}
                          <div className={`h-full ${printMode === 'exam' ? 'print:hidden' : ''}`}>
                            <div className="flex items-center gap-2 mb-4 text-blue-800">
                              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                              <span className="font-bold text-xl">深度解析</span>
                              <span className="ml-auto bg-red-100 text-red-700 px-4 py-1.5 rounded-full text-base font-bold shadow-sm">
                                解答：{q.correctAnswer}
                              </span>
                            </div>
                            
                            <div className="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                              <h4 className="font-bold text-lg sm:text-xl text-[#FF0000] mb-3">{q.explanation.title}</h4>
                              <p className="text-gray-700 mb-5 leading-relaxed text-base sm:text-lg bg-yellow-100/50 p-3 rounded whitespace-pre-wrap">
                                <span className="font-semibold text-amber-700">💡 核心觀念：</span>
                                {q.explanation.coreConcept}
                              </p>
                              
                              <ul className="space-y-4">
                                {q.explanation.details.map((detail, idx) => (
                                  <li key={idx} className="text-base sm:text-lg leading-relaxed whitespace-pre-wrap">
                                    <span className={`font-semibold mr-2 ${q.correctAnswer !== "見解析" && detail.opt.includes(q.correctAnswer + ")") ? 'text-green-700' : 'text-gray-800'}`}>
                                      {detail.opt}
                                    </span>
                                    <span className="text-gray-600">
                                      {detail.desc}
                                    </span>
                                  </li>
                                ))}
                              </ul>
                            </div>
                          </div>
                          
                        </div>

                      </div>
                    );

                    // 若是該出處的第一題，將「出處標籤」與「第一題內容」打包成一個不可分割的區塊 (break-inside-avoid)
                    if (isFirst) {
                      const isHanjin = groupName.includes('超級翰將');
                      const tagBgClass = isHanjin ? 'bg-[#0000ff] text-white' : 'bg-[#FF8800] text-white';
                      const printColorClass = isHanjin ? 'print:text-[#0000ff] print:border-[#0000ff]' : 'print:text-[#FF8800] print:border-[#FF8800]';

                      return (
                        <div key={`wrapper-${groupName}`} className="print:break-inside-avoid flex flex-col">
                          {/* 出處標題標籤 */}
                          <div className={`flex items-center border-b-2 border-gray-400 pb-2 ${printMode === 'exam' ? 'mb-2 print:mb-1' : 'mb-4'} print:border-gray-800`}>
                            <span className={`${tagBgClass} px-4 py-1.5 text-md font-bold rounded-t-lg tracking-widest print:bg-white print:border-2 ${printColorClass} print:rounded-md print:px-3`}>
                              📂 出處：{groupName}
                            </span>
                          </div>
                          {questionContent}
                        </div>
                      );
                    }

                    // 不是第一題，就直接輸出內容
                    return questionContent;
                  })}
                </div>
              ))}
            </div>

            {/* 頁尾 */}
            <div className="mt-8 text-center text-gray-400 text-sm print:block">
              - 努力學習，必有收穫 -
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MistakeNotebook />);
  </script>
</body>
</html>
